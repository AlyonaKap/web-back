version: "3.1"
services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./frontend/dist:/srv/www/static
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - python
      - nodejs
  nodejs:
    image: node:alpine
    environment:
      NODE_ENV: production
    working_dir: /app
    restart: always
    ports:
      - "8001:3000"
    volumes:
      - ./node-app:/app
    depends_on:
      - php
    command: node index.js

  php:
    image: webdevops/php-nginx:8.2
    
    volumes:
      - ./php-app:/app
    ports:
      - "8003:80"
    environment:
      WEB_DOCUMENT_ROOT: /app/public
  python:
    image: python:3.9-slim
    working_dir: /app
    restart: always
    ports:
      - "8002:5000"
    volumes:
      - ./python-app:/app
    command: sh -c "pip install flask && python app.py"
